name: Publish to PyPI

# Publishes the package to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored in the repo.
# One-time setup: on PyPI, add a Trusted Publisher for this project pointing at
# this repository and the "publish.yml" workflow.
# https://docs.pypi.org/trusted-publishers/

on:
  release:
    types: [published]

jobs:
  # Runs before the "pypi" environment's approval gate, so a release tagged
  # without bumping src/aws_assume_role/version.py fails here instead of
  # waiting for an approver and then being rejected by PyPI.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python3 -c 'exec(open("src/aws_assume_role/version.py").read()); print(__version__)')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package version $VERSION in src/aws_assume_role/version.py"
            exit 1
          fi

  build-and-publish:
    needs: check-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
